[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA: barcha yo'llar index.html ga (mavjud fayllar avval beriladi)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Xeshlangan fayllar o'zgarmaydi — uzoq muddat keshlash
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Content-Security-Policy: vercel.json dagi bilan bir xil bo'lishi kerak (test tekshiradi).
# Inline skript yo'q (mavzu skripti public/theme-init.js da), shuning uchun script-src 'self' yetarli
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
