name: GitHub Pages

# Namoyish (demo) sayti: https://ulugbek-ar.github.io/eduflow-crm/ — asosiy sayt Vercel'da (vercel.json)
# Shu branch'ga har push'da tekshiruv (npm run check) o'tsa, sayt qayta yig'ilib gh-pages branch'iga joylanadi
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: build va gh-pages ga joylash
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      # Sayt /eduflow-crm/ ostida: /app, /privacy, /terms to'g'ridan-to'g'ri ochilishi uchun 404.html = index.html
      - run: npx vite build --base /eduflow-crm/ --outDir site && cp site/index.html site/404.html && touch site/.nojekyll
        env:
          VITE_SITE_URL: https://ulugbek-ar.github.io/eduflow-crm
          # Pages — faqat namoyish: ro'yxatdan o'tish yo'q, /app da darhol "Demo'ni ko'rish"
          VITE_DEMO_ONLY: '1'
          VITE_MAIN_SITE_URL: ${{ vars.MAIN_SITE_URL }}

      - name: gh-pages branch'iga joylash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
